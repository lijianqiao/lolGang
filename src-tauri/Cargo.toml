[package]
name = "lolping"
version = "3.2.0"
description = "常驻桌面的英雄联盟开黑小工具：屏幕上发信号、放表情、按住说话，队友同步看到"
authors = ["lijianqiao"]
license = "MIT"
repository = "https://github.com/lijianqiao/lolPing-rust"
# 安装包把它写进 Windows「已安装的应用」里的支持链接
homepage = "https://github.com/lijianqiao/lolPing-rust"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lolping_lib"
# 只要 rlib：模板里的 staticlib、cdylib 是给手机端留的，桌面的 exe 用不到，留着每次构建多出两份产物（3.3.0）
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hkdf = "0.13"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
getrandom = "0.4"
thiserror = "2"
ciborium = "0.2"
serde_bytes = "0.11"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
keyring = "4"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread"] }
if-addrs = "0.15"
k256 = { version = "0.14", features = ["precomputed-tables", "schnorr", "std"], default-features = false }
base64 = "0.23"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
cpal = "0.18"
opus-rs = "0.1"


# 只有 input/win32.rs、input/macos.rs 能写 unsafe（这两个文件开头放开了），别处写了编译不过（3.2.0）
[lints.rust]
unsafe_code = "deny"

# 那两个文件里每个 unsafe 块前面都要有 `// SAFETY:` 写明为什么成立
[lints.clippy]
undocumented_unsafe_blocks = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[dev-dependencies]
minisign = "0.10.0"
tauri = { version = "2", features = ["test"] }
