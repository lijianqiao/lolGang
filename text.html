<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>lolPing</title>
  </head>
  <body>
    <section class="chat">
      <header class="cap">
        <!-- 按钮上的字和下面输入框的提示由 src/text/main.ts 按界面语言填（3.3.2） -->
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-filter="all" aria-selected="true"></button>
          <button type="button" role="tab" data-filter="text" aria-selected="false"></button>
          <button type="button" role="tab" data-filter="voice" aria-selected="false"></button>
          <button type="button" role="tab" data-filter="signal" aria-selected="false"></button>
        </div>
        <button type="button" id="close">✕</button>
      </header>
      <ol id="log" aria-live="polite"></ol>
      <form class="box">
        <div class="line">
          <input id="message" type="text" autocomplete="off" spellcheck="false" />
          <span id="count" hidden></span>
        </div>
        <div id="hint"></div>
      </form>
    </section>
    <script type="module" src="/src/text/main.ts"></script>
  </body>
</html>
