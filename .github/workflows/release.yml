# 发版：推送 v 开头的标签（比如 v2.0.0）时运行。Windows、macOS 各自打包、给更新包签名，全部成功后才建 Release，
# 上传安装包和 latest.json（已安装的程序从 releases/latest/download/latest.json 查新版本）。
# 需要仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY（更新私钥文件的内容）和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD（生成私钥时设的密码）。
# 更新说明取自带注释的标签：git tag -a v2.0.0 -m "这一版改了什么"。macOS 是实验版；3.1 起不再出 Linux 的包。
name: 发版

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis
          - os: macos-latest
            platform: macos
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 版本号和标签一致、更新公钥已填
        run: node scripts/release.mjs check "${{ github.ref_name }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri.release.conf.json 打开 createUpdaterArtifacts：用私钥给更新包签名（本机 pnpm release 不签）
      - name: 打包并签名
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - run: node scripts/release.mjs collect ${{ matrix.platform }} out
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: 更新说明（标签的注释）
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git for-each-ref "refs/tags/${{ github.ref_name }}" --format='%(contents)' > notes.md
          if [ ! -s notes.md ]; then echo "lolPing ${{ github.ref_name }}" > notes.md; fi
      - run: node scripts/release.mjs manifest out "${{ github.ref_name }}" notes.md
      - name: 建 Release 并上传
        run: gh release create "${{ github.ref_name }}" out/* --title "lolPing ${{ github.ref_name }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
